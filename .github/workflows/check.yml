name: Check

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Use the lockfile npm version
        run: npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Toolchain
        run: |
          node --version
          npm --version
          uname -m
          if [ "${RUNNER_OS}" = "macOS" ]; then xcrun swiftc --version; fi
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm pack --dry-run --ignore-scripts
